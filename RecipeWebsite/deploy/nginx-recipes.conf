# nginx site for Recipe Box.
#
#   sudo cp deploy/nginx-recipes.conf /etc/nginx/sites-available/recipes
#   sudo ln -sf /etc/nginx/sites-available/recipes /etc/nginx/sites-enabled/recipes
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Per-address rate limits. Everything: 10 requests a second. Adding and
# removing recipes: 10 a minute, so a script cannot flood the database.
map $request_method $recipes_write_key {
    default "";
    POST    $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=recipes_pages:10m  rate=10r/s;
limit_req_zone $recipes_write_key  zone=recipes_writes:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Only public/ is reachable. app/ (code and the database password),
    # db/ and .git stay outside the web root.
    root /var/www/recipes/public;
    index index.html;

    server_tokens off;
    client_max_body_size 32k;
    limit_req_status 429;

    # Never serve dotfiles such as .git or .env.
    location ~ /\. {
        return 404;
    }

    # Nothing here runs PHP, and a leftover .php file is never handed out.
    location ~ \.php {
        return 404;
    }

    # The API (app/server.py, run by recipes-api.service). It is the only
    # thing that talks to MySQL. GET reads; POST and DELETE change the database.
    location /api/ {
        # To let only your own machines add or remove recipes, uncomment
        # these and list your team's addresses:
        # limit_except GET {
        #     allow 127.0.0.1;
        #     allow 10.0.0.0/24;
        #     deny all;
        # }

        limit_req zone=recipes_pages  burst=20 nodelay;
        limit_req zone=recipes_writes burst=5  nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
    }

    # The static site: four HTML pages, app.js and the stylesheet.
    location / {
        limit_req zone=recipes_pages burst=20 nodelay;
        # Scripts, styles and API calls may only come from this site itself.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }
}
