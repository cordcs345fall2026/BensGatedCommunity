# nginx site for Recipe Box.
#
#   sudo cp deploy/nginx-recipes.conf /etc/nginx/sites-available/recipes
#   sudo ln -sf /etc/nginx/sites-available/recipes /etc/nginx/sites-enabled/recipes
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Per-address rate limits. Pages: 10 requests a second. Form posts (adding
# and removing recipes): 10 a minute, so a script cannot flood the database.
map $request_method $recipes_post_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=recipes_pages:10m  rate=10r/s;
limit_req_zone $recipes_post_key   zone=recipes_writes:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Only public/ is reachable. app/ (code and the database password),
    # db/ and .git stay outside the web root.
    root /var/www/recipes/public;
    index index.php;

    server_tokens off;
    client_max_body_size 16k;
    limit_req_status 429;

    # Never serve dotfiles such as .git or .env.
    location ~ /\. {
        return 404;
    }

    # Read-only pages.
    location ~ ^/(index|recipe)\.php$ {
        limit_req zone=recipes_pages burst=20 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        # If "ls /run/php/" shows no php-fpm.sock, use the versioned name it
        # does show, for example unix:/run/php/php8.3-fpm.sock
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Pages that change the database.
    location ~ ^/(add|delete)\.php$ {
        # To let only your own machines add or remove recipes, uncomment
        # these and list your team's addresses:
        # allow 127.0.0.1;
        # allow 10.0.0.0/24;
        # deny all;

        limit_req zone=recipes_pages  burst=20 nodelay;
        limit_req zone=recipes_writes burst=5  nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # No other PHP file is ever executed.
    location ~ \.php {
        return 404;
    }

    # Static files (the stylesheet) and the "/" to index.php redirect.
    location / {
        limit_req zone=recipes_pages burst=20 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
