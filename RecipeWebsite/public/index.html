<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes - Recipe Box</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body data-page="list">
<header class="site-header">
  <a class="site-name" href="index.html">Recipe Box</a>
  <a class="button" href="add.html">Add a recipe</a>
</header>
<main>
<form class="search" action="index.html" method="get" role="search">
  <label for="q">Search recipes</label>
  <input type="search" id="q" name="q" maxlength="100">
  <button type="submit">Search</button>
</form>

<p class="notice" role="status" id="removed" hidden>Recipe removed.</p>

<h1 id="heading">All recipes</h1>
<p id="summary">Loading recipes&hellip;</p>
<noscript><p class="error">This site needs JavaScript to load recipes from the database.</p></noscript>
<p id="empty" hidden>Nothing matches that search. Try a single ingredient, such as &ldquo;garlic&rdquo;.</p>

<ul class="recipes" id="recipes" hidden></ul>

<nav class="pages" id="pages" aria-label="Pages" hidden></nav>
</main>
</body>
</html>
