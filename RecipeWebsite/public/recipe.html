<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe - Recipe Box</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body data-page="recipe">
<header class="site-header">
  <a class="site-name" href="index.html">Recipe Box</a>
  <a class="button" href="add.html">Add a recipe</a>
</header>
<main>
<p id="status">Loading recipe&hellip;</p>
<noscript><p class="error">This site needs JavaScript to load recipes from the database.</p></noscript>

<div id="content" hidden>
<p class="notice" role="status" id="added" hidden>Recipe added.</p>

<article class="card">
  <h1 id="title"></h1>
  <p class="lead" id="description"></p>

  <dl class="facts">
    <div><dt>Category</dt><dd id="category"></dd></div>
    <div><dt>Prep</dt><dd id="prep"></dd></div>
    <div><dt>Cook</dt><dd id="cook"></dd></div>
    <div><dt>Serves</dt><dd id="servings"></dd></div>
  </dl>

  <h2>Ingredients</h2>
  <ul class="ruled" id="ingredients"></ul>

  <h2>Steps</h2>
  <ol class="ruled" id="instructions"></ol>
</article>

<p class="actions">
  <a href="index.html">Back to all recipes</a>
  <span class="muted" id="protected" hidden>Starter recipes can&rsquo;t be removed. Recipes added through the site can.</span>
  <a class="danger" id="remove" hidden>Remove this recipe</a>
</p>
</div>
</main>
</body>
</html>
